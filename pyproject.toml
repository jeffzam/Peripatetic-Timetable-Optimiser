[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "peripatetic-timetable-optimiser"
version = "2.1.2"
description = "Professional desktop transfer planner for peripatetic teachers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1,<4"]

[project.scripts]
peripatetic-timetable = "peripatetic_timetable.main:main"

[tool.setuptools.package-data]
peripatetic_timetable = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
